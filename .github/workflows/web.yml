# Publishes Medieval Village (Marchland) on GitHub Pages at https://anbow1.github.io/mediveal-village/
# on every push to main that touches games/new-game (and on demand via workflow_dispatch).
#
# The built site is force-pushed as a single commit to the gh-pages branch (never growing history and
# using zero GitHub Actions artifact storage). Repository Pages source is set to branch `gh-pages`, `/`.

name: Medieval Village on the web

on:
  push:
    branches: [main]
    paths:
      - 'games/new-game/**'
      - '!games/new-game/android/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mediveal-village-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: games/new-game/package-lock.json

      - name: Build web bundle
        working-directory: games/new-game
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build

      - name: Assemble the site
        run: |
          rm -rf site
          cp -r games/new-game/dist site

      - name: Push the site to gh-pages
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Medieval Village web build from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
